name = "plugoff-api-gateway"
main = "rate-limiter-worker.js"
compatibility_date = "2026-10-26"

# Configure API_ORIGIN to your actual HTTPS backend before deployment.
# Attach this Worker to the SAME site origin at /api/*.
# No invented production domains or API credentials are included here.
[[ratelimits]]
name = "AUTH_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "CONTACT_LIMITER"
namespace_id = "1002"
simple = { limit = 3, period = 60 }

[[ratelimits]]
name = "CHECKOUT_LIMITER"
namespace_id = "1003"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "API_LIMITER"
namespace_id = "1004"
simple = { limit = 60, period = 60 }
